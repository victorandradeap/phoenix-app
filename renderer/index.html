<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Phoenix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <svg class="logo" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <defs>
        <linearGradient id="flameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color: var(--accent-start)" />
          <stop offset="1" style="stop-color: var(--accent-end)" />
        </linearGradient>
      </defs>
      <path d="M12 21c-4 0-7-2.8-7-7 0-3.5 2.2-5.8 3.4-8.3.3-.6 1.1-.6 1.4.1.5 1.2.6 2.5 1.8 2.5 1.6 0 1-3.3 2-6.1.2-.6 1-.7 1.4-.1C16.7 4.9 19 8.4 19 12c0 4.4-3 9-7 9z" fill="url(#flameGrad)" />
    </svg>
    <div class="header-text">
      <h1>Phoenix</h1>
      <p class="subtitle">Backup entre discos e pastas</p>
    </div>
  </header>

  <main>
    <section id="status" class="status"></section>

    <!-- Tela 1: seleção de pastas -->
    <section id="screen-select" class="screen">
      <div class="step-indicator">
        <div class="step">
          <div class="step-circle active">1</div>
          <span class="step-label current">Selecionar</span>
        </div>
        <div class="step-connector"></div>
        <div class="step">
          <div class="step-circle inactive">2</div>
          <span class="step-label">Analisar</span>
        </div>
        <div class="step-connector"></div>
        <div class="step">
          <div class="step-circle inactive">3</div>
          <span class="step-label">Copiar</span>
        </div>
      </div>

      <div class="folders-row">
        <div class="folder-card">
          <div class="folder-card-header">
            <div class="folder-icon-badge origem">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </div>
            <span class="folder-card-label">Origem</span>
          </div>
          <div id="source-path" class="folder-card-path placeholder">Nenhuma pasta selecionada</div>
          <button id="btn-select-source" class="btn-outline">Selecionar pasta</button>
        </div>

        <svg class="folder-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>

        <div class="folder-card">
          <div class="folder-card-header">
            <div class="folder-icon-badge destino">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </div>
            <span class="folder-card-label">Destino</span>
          </div>
          <div id="target-path" class="folder-card-path placeholder">Nenhuma pasta selecionada</div>
          <button id="btn-select-target" class="btn-outline">Selecionar pasta</button>
        </div>
      </div>

      <p class="helper-text">A cópia preserva os arquivos originais — nada é apagado da origem.</p>

      <div class="actions actions-center">
        <button id="btn-analyze" class="btn-primary" disabled>
          <span>Analisar</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </button>
      </div>
    </section>

    <!-- Tela 2: análise e cópia -->
    <section id="screen-analyze" class="screen hidden">
      <div class="step-indicator">
        <div class="step">
          <div id="astep1-circle" class="step-circle inactive">1</div>
          <span id="astep1-label" class="step-label">Selecionar</span>
        </div>
        <div id="aconnector1" class="step-connector"></div>
        <div class="step">
          <div id="astep2-circle" class="step-circle inactive">2</div>
          <span id="astep2-label" class="step-label">Analisar</span>
        </div>
        <div id="aconnector2" class="step-connector"></div>
        <div class="step">
          <div id="astep3-circle" class="step-circle inactive">3</div>
          <span id="astep3-label" class="step-label">Copiar</span>
        </div>
      </div>

      <div class="analyze-header">
        <button id="btn-back" class="btn-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
          <span>Voltar</span>
        </button>
        <div class="analyze-paths">
          <span id="analyze-source-path" class="path-chip"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span id="analyze-target-path" class="path-chip"></span>
        </div>
      </div>

      <div id="progress-wrap" class="progress-card hidden">
        <div class="progress-spinner"></div>
        <div id="progress-title" class="progress-title"></div>
        <div id="progress-count" class="progress-count"></div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-caption" class="progress-caption"></span>
      </div>

      <div class="results">
        <div id="summary" class="summary"></div>
        <div class="files-table-wrap">
          <table id="files-table" class="files-table hidden">
            <thead>
              <tr>
                <th>Arquivo</th>
                <th>Tamanho</th>
                <th>Modificado em</th>
              </tr>
            </thead>
            <tbody id="files-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="actions actions-center">
        <button id="btn-copy" class="btn-primary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
          <span>Copiar arquivos</span>
        </button>
        <button id="btn-reanalyze" class="btn-outline">Analisar novamente</button>
      </div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
